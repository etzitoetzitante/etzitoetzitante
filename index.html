<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>etzitoetzitante</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;text-align:center} .avatar{width:110px;height:110px;border-radius:50%;border:3px solid #c9a86a;margin:40px auto 10px;background:#222 url('https://picsum.photos/300') center/cover} .btn{display:block;background:#151515;border:1px solid #222;padding:14px;margin:10px auto;max-width:340px;border-radius:14px;color:#fff;text-decoration:none} .chat{max-width:340px;margin:20px auto;background:#121212;border:1px solid #222;border-radius:16px;overflow:hidden} #msgs{height:260px;overflow:auto;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px} .me{background:#c9a86a;color:#000;align-self:flex-end;padding:8px 12px;border-radius:14px} .you{background:#222;padding:8px 12px;border-radius:14px;align-self:flex-start}</style></head><body>
<div class="avatar"></div><h1>etzitoetzitante</h1>
<a class="btn" href="https://facebook.com/etzitoetzitante">📘 Facebook @etzitoetzitante</a>
<a class="btn" href="https://instagram.com/etzitoetzitante">📸 Instagram @etzitoetzitante</a>
<a class="btn" href="https://twitter.com/etzitoetzitante">🐦 X @etzitoetzitante</a>
<a class="btn" href="https://tiktok.com/@etzitoetzitante">🎵 TikTok @etzitoetzitante</a>
<a class="btn" href="https://threads.net/@etzitoetzitante">🧵 Threads @etzitoetzitante</a>

<div class="chat"><div id="msgs"><div class="you">Hola soy Etzito, escribe aquí 👇 chat en la misma web</div></div><div style="display:flex;padding:8px;gap:6px"><input id="inp" placeholder="Escribe..." style="flex:1;background:#0a0a0a;border:1px solid #333;color:#fff;padding:10px;border-radius:20px"><button onclick="send()" style="background:#c9a86a;border:none;width:40px;border-radius:50%">➤</button></div>
<script>
let msgs = JSON.parse(localStorage.getItem('etzito')||'[]');
const box = document.getElementById('msgs');
function render(){ box.innerHTML='<div class="you">Hola soy Etzito, escribe aquí 👇</div>'; msgs.forEach(m=>box.innerHTML+=`<div class="${m.t}">${m.x}</div>`); box.scrollTop=box.scrollHeight; } render();
function send(){ const i=document.getElementById('inp'); if(!i.value.trim())return; msgs.push({t:'me',x:i.value}); localStorage.setItem('etzito',JSON.stringify(msgs)); i.value=''; render(); setTimeout(()=>{ msgs.push({t:'you',x:'Ya vi tu mensaje, te respondo en un momento 😉'}); localStorage.setItem('etzito',JSON.stringify(msgs)); render(); },800); }
</script>
</body></html>
